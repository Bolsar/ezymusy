# Built on detekt defaults (buildUponDefaultConfig) plus io.nlopez compose rules.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
style:
  ReturnCount:
    excludeGuardClauses: true
  MagicNumber:
    excludes: ['**/core/designsystem/**', '**/test/**']
    ignoreAnnotated: ['Preview']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
Compose:
  ModifierMissing:
    active: true
