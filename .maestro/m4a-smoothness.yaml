# M4a: cold start, Next twice (resolved ahead + preloaded), then a warm restart.
# Timings: adb logcat -s Perf
appId: com.ezymusy.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "link_input"
- inputText: "https://www.youtube.com/playlist?list=PLFgquLnL59alCl_2TQvOiD5Vgm1hCaGSI"
- tapOn:
    id: "add_link"
- extendedWaitUntil:
    visible: "Playlist · .* tracks"
    timeout: 60000
- tapOn:
    id: "link_row"
- tapOn:
    id: "track_row"
    index: 0
- tapOn:
    id: "mini_player"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 20000
# Let resolve-ahead and preload finish.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: "next"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: "next"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 5000
- tapOn:
    id: "back"
- tapOn:
    id: "track_row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "mini_title"
    timeout: 10000
